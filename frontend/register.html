<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Career Guidance</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="register-page">

        <div class="register-card">

            <div class="text-center mb-4">

                <i class="fa-solid fa-user-graduate register-logo"></i>

                <h2>Create Your Account</h2>

                <p>Start your AI Career Journey</p>

            </div>

            <form id="registerForm">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Full Name</label>
                        <input type="text" id="fullName" class="form-control custom-input"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" id="email" class="form-control custom-input" placeholder="Enter Email"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Mobile Number</label>
                        <input type="tel" id="mobile" class="form-control custom-input" placeholder="9876543210"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>College Name</label>
                        <input type="text" id="college" class="form-control custom-input" placeholder="College Name"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Branch</label>

                        <select id="branch" class="form-control custom-input" required>

                            <option value="">Select Branch</option>
                            <option>Computer Engineering</option>
                            <option>Information Technology</option>
                            <option>ENTC</option>
                            <option>Mechanical</option>
                            <option>Civil</option>
                            <option>Electrical</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Current Year</label>

                        <select id="year" class="form-control custom-input" required>

                            <option value="">Select Year</option>
                            <option>First Year</option>
                            <option>Second Year</option>
                            <option>Third Year</option>
                            <option>Final Year</option>

                        </select>

                    </div>

                    <div class="col-12 mb-3">
                        <label>Skills</label>

                        <input type="text" id="skills" class="form-control custom-input"
                            placeholder="Python, HTML, Java, SQL">
                    </div>

                    <div class="col-12 mb-3">

                        <label>Career Interests</label>

                        <select id="interests" class="form-control custom-input">

                            <option value="">Select Interest</option>

                            <option>Artificial Intelligence</option>

                            <option>Software Development</option>

                            <option>Cyber Security</option>

                            <option>Cloud Computing</option>

                            <option>Data Science</option>

                            <option>Embedded Systems</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Password</label>

                        <input type="password" id="password" class="form-control custom-input" placeholder="Password"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Confirm Password</label>

                        <input type="password" id="confirmPassword" class="form-control custom-input"
                            placeholder="Confirm Password" required>

                    </div>

                </div>

                <button type="submit" class="register-submit">

                    Create Account

                </button>

            </form>
            <div class="text-center mt-4">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </div>

        </div>

    </div>
    <script src="js/auth.js"></script>
</body>

</html>
