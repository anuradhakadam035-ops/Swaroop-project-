<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | AI Career Guidance</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/students.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <i class="fa-solid fa-brain"></i>

                <span>AI Career</span>

            </div>

            <ul>

                <li onclick="location.href='admin.html'">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </li>

                <li onclick="location.href='students.html'">

                    <i class="fa-solid fa-user-graduate"></i>

                    Students

                    </a>
                </li>

                <li onclick="location.href='admin_questions.html'">

                    <i class="fa-solid fa-file-circle-question"></i>

                    Questions
                    </a>
                </li>

                <li onclick="location.href='report.html'">
                    <i class="fa-solid fa-chart-column"></i>

                    Reports

                    </a>
                </li>

                <li onclick="location.href='analytics.html'">
                    <i class="fa-solid fa-robot"></i>

                    AI Analytics
                </li>
                <li onclick="location.href='settings.html'">
                    <i class="fa-solid fa-gear"></i>

                    Settings
                </li>

                <li onclick="location.href='admin_login.html'">
                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </li>

            </ul>

        </aside>

        <!-- Main -->

        <main class="main-content">

            <div class="topbar">

                <div>

                    <h2>

                        Student Management

                    </h2>

                    <p>

                        Manage all registered students

                    </p>

                </div>

                <div class="top-right">

                    <div class="search">

                        <i class="fa fa-search"></i>

                        <input id="searchStudent" type="text" placeholder="Search student...">

                    </div>

                    <button class="add-btn">

                        <i class="fa-solid fa-user-plus"></i>

                        Add Student

                    </button>

                </div>

            </div>

            <!-- Table -->

            <div class="table-card">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Branch</th>

                            <th>Year</th>

                            <th>Career</th>

                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="studentTable">

                    </tbody>

                </table>

            </div>

            <!-- Pagination -->

            <div class="pagination-box">

                <button id="prevBtn">

                    <i class="fa-solid fa-angle-left"></i>

                </button>

                <span id="pageInfo">

                    Page 1

                </span>

                <button id="nextBtn">

                    <i class="fa-solid fa-angle-right"></i>

                </button>

            </div>

        </main>

    </div>

    <!-- View Student Modal -->

    <div class="modal fade" id="studentModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">

                        Student Details

                    </h5>

                    <button class="btn-close" data-bs-dismiss="modal">

                    </button>

                </div>

                <div class="modal-body">

                    <form id="editForm">

                        <input type="hidden" id="studentId">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Name</label>

                                <input class="form-control" id="fullName">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Email</label>

                                <input class="form-control" id="email">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Mobile</label>

                                <input class="form-control" id="mobile">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>College</label>

                                <input class="form-control" id="college">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Branch</label>

                                <input class="form-control" id="branch">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Year</label>

                                <input class="form-control" id="year">

                            </div>

                            <div class="col-12 mb-3">

                                <label>Skills</label>

                                <input class="form-control" id="skills">

                            </div>

                            <div class="col-12 mb-3">

                                <label>Interests</label>

                                <textarea class="form-control" id="interests"></textarea>

                            </div>

                            <button class="btn btn-primary w-100" type="submit">

                                Save Changes

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/students.js"></script>
    <script src="js/logout.js"></script>
</body>

</html>
