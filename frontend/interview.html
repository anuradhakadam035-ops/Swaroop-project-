<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Mock Interview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/interview.css">

</head>

<body>

    <div class="container py-5">

        <div class="interview-card">

            <h2>

                <i class="fa-solid fa-user-tie"></i>

                AI Mock Interview

            </h2>

            <p>Practice interviews with AI and receive instant feedback.</p>

            <div class="mt-4">

                <label class="form-label">

                    Select Career

                </label>

                <select id="career" class="form-select">

                    <option value="AI Engineer">AI Engineer</option>

                    <option value="Web Developer">Web Developer</option>

                </select>

            </div>

            <button id="startBtn" class="btn btn-primary mt-4">

                Start Interview

            </button>

        </div>

        <div id="interviewSection" style="display:none;">

            <div class="question-card mt-5">

                <h5>

                    Question

                    <span id="questionNumber">

                        1

                    </span>

                </h5>

                <p id="questionText"></p>

                <textarea id="answer" class="form-control mt-3" rows="6" placeholder="Type your answer..."></textarea>

                <button id="submitBtn" class="btn btn-success mt-4">

                    Submit Answer

                </button>

            </div>

            <div id="resultCard" class="result-card mt-4" style="display:none;">

                <h4>

                    Score:

                    <span id="score"></span>/10

                </h4>

                <h5>Strengths</h5>

                <ul id="strengths"></ul>

                <h5>Improvements</h5>

                <ul id="improvements"></ul>

                <h5>Feedback</h5>

                <p id="feedback"></p>

                <button id="nextBtn" class="btn btn-primary">

                    Next Question

                </button>

            </div>

        </div>

    </div>

    <script src="js/interview.js"></script>

</body>

</html>
