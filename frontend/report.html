<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Career Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/report.css">

</head>

<body>

    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="container py-5" id="report">

        <!-- Header -->

        <div class="hero">

            <div class="profile">

                <img id="profilePhoto" src="images/user.png">

                <div>

                    <h2 id="studentName">

                        Student Name

                    </h2>

                    <p id="studentCareer">

                        AI Engineer

                    </p>

                </div>

            </div>

            <div class="overall">

                <h5>Overall AI Score</h5>

                <div class="circle">

                    <span id="overallScore">

                        91%

                    </span>

                </div>

            </div>

        </div>

        <!-- Score Cards -->

        <div class="row mt-5 g-4">

            <div class="col-lg-3">

                <div class="score-card resume">

                    <i class="fas fa-file-alt"></i>

                    <h6>Resume</h6>

                    <h2 id="resumeScore">

                        92%

                    </h2>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="score-card ats">

                    <i class="fas fa-chart-line"></i>

                    <h6>ATS</h6>

                    <h2 id="atsScore">

                        88%

                    </h2>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="score-card interview">

                    <i class="fas fa-user-tie"></i>

                    <h6>Interview</h6>

                    <h2 id="interviewScore">

                        84%

                    </h2>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="score-card career">

                    <i class="fas fa-bullseye"></i>

                    <h6>Career Match</h6>

                    <h2 id="careerScore">

                        95%

                    </h2>

                </div>

            </div>

        </div>

        <!-- AI Recommendation -->

        <div class="glass mt-5">

            <h3>

                🤖 AI Recommendation

            </h3>

            <h2 id="careerName">

                AI Engineer

            </h2>

            <p id="careerReason">

                Loading...

            </p>

        </div>

        <!-- Resume -->

        <div class="glass mt-4">

            <h3>

                📄 Resume Analysis

            </h3>

            <div class="chips" id="skills">

            </div>

            <h5 class="mt-4">

                Missing Skills

            </h5>

            <div class="chips warning" id="missingSkills">

            </div>

        </div>

        <!-- Interview -->

        <div class="glass mt-4">

            <h3>

                🎤 Interview Feedback

            </h3>

            <p id="interviewFeedback">

                Loading...

            </p>

        </div>

        <!-- Learning Roadmap -->

        <div class="glass mt-4">

            <h3>

                🛣 Learning Roadmap

            </h3>

            <div id="roadmap">

            </div>

        </div>

        <!-- Buttons -->

        <div class="text-center mt-5">

            <button class="btn btn-primary" id="downloadBtn">

                <i class="fas fa-download"></i>

                Download PDF

            </button>

            <button class="btn btn-success" onclick="window.print()">

                <i class="fas fa-print"></i>

                Print

            </button>

        </div>

    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/report.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


</body>

</html>
