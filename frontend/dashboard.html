<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | AI Career Guidance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->

            <div class="col-lg-2 sidebar">

                <h3 class="logo">

                    <i class="fa-solid fa-brain"></i>

                    AI Career

                </h3>

                <ul>

                    <li class="active">

                        <i class="fa-solid fa-house"></i>

                        Dashboard

                    </li>

                    <li onclick="location.href='profile.html'">

                        <i class="fa-solid fa-user"></i>

                        Profile

                    </li>

                    <li onclick="location.href='resume.html'">

                        <i class="fa-solid fa-file"></i>

                        Resume

                    </li>

                    <li onclick="location.href='assessment.html'">

                        <i class="fa-solid fa-list-check"></i>

                        Assessment

                    </li>

                    <li onclick="location.href='recommendations.html'">

                        <i class="fa-solid fa-lightbulb"></i>

                        Recommendation

                    </li>
                    <li onclick="location.href='chatbot.html'">

                        <i class="fa-solid fa-lightbulb"></i>

                        chatbot

                    </li>
                    <li onclick="location.href='interview.html'">

                        <i class="fa-solid fa-lightbulb"></i>

                        Interview
                    </li>
                    <li onclick="location.href='job.html'">

                        <i class="fa-solid fa-lightbulb"></i>

                        Jobs

                    </li>

                    <li onclick="location.href='report.html'">

                        <i class="fa-solid fa-lightbulb"></i>

                        Report

                    </li>


                    <li onclick="location.href='roadmap.html'">

                        <i class="fa-solid fa-lightbulb"></i>

                        Roadmap

                    </li>




                    <li onclick="logout()">

                        <i class="fa-solid fa-right-from-bracket"></i>

                        Logout

                    </li>

                </ul>

            </div>

            <!-- Main Content -->

            <div class="col-lg-10 main-content">

                <!-- Header -->

                <div class="topbar">

                    <div>

                        <h2>

                            Welcome Back,

                            <span id="studentName"></span>

                        </h2>

                        <p>Let's continue your AI journey 🚀</p>

                    </div>

                    <img id="profilePhoto" src="assets/default-user.png" class="profile-img">

                </div>

                <!-- Cards -->

                <div class="row mt-4">

                    <div class="col-md-3">

                        <div class="card-box">

                            <i class="fa-solid fa-file-lines"></i>

                            <h3 id="resumeScore">0%</h3>

                            <p>Resume ATS</p>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card-box">

                            <i class="fa-solid fa-list-check"></i>

                            <h3 id="assessmentScore">0%</h3>

                            <p>Assessment</p>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card-box">

                            <i class="fa-solid fa-user-graduate"></i>

                            <h3 id="career">-</h3>

                            <p>Career</p>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card-box">

                            <i class="fa-solid fa-chart-line"></i>

                            <h3 id="progress">0%</h3>

                            <p>Progress</p>

                        </div>

                    </div>

                </div>

                <!-- Skills -->

                <div class="dashboard-section mt-5">

                    <h4>

                        <i class="fa-solid fa-code"></i>

                        Skills

                    </h4>

                    <div id="skills"></div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/dashboard.js"></script>

</body>

</html>
