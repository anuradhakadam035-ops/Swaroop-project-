<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VisionX | Admin Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/admin_reg.css">
</head>

<body>

    <!-- Animated background -->
    <div class="grid-bg"></div>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <main class="register-page">

        <div class="register-card">

            <div class="logo">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <div class="heading">
                <span class="admin-badge">
                    <i class="fa-solid fa-shield-halved"></i>
                    ADMIN PORTAL
                </span>

                <h1>Create Administrator Account</h1>

                <p>Register a new VisionX administration account.</p>
            </div>

            <!-- Success / error message -->
            <div id="registerMessage" class="register-message" role="alert" aria-live="polite"></div>

            <form id="registerForm" autocomplete="on">

                <div class="field">
                    <label for="fullName">Name</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="fullName" placeholder="Enter full name" autocomplete="name" required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Enter admin email" autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label for="mobile">Mobile Number</label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" id="mobile" placeholder="10-digit mobile number" maxlength="10"
                            inputmode="numeric" autocomplete="tel" required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>

                        <input type="password" id="password" placeholder="Create password" autocomplete="new-password"
                            required>

                        <button type="button" id="passwordToggle" class="password-toggle" aria-label="Show password"
                            title="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>

                        <input type="password" id="confirmPassword" placeholder="Confirm password"
                            autocomplete="new-password" required>

                        <button type="button" id="confirmPasswordToggle" class="password-toggle"
                            aria-label="Show password" title="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="registerBtn" class="register-btn">
                    <i class="fa-solid fa-user-plus"></i>
                    Create Admin Account
                </button>
                <div id="registerMessage"></div>
            </form>

            <div class="login-link">
                Already have an account?
                <a href="admin_login.html">Login <i class="fa-solid fa-arrow-right"></i></a>
            </div>

        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin_reg.js"></script>

</body>

</html>
