<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/questions.css">

</head>

<body>

    <div class="dashboard">

        <!---------------- SIDEBAR ---------------->

        <aside class="sidebar">

            <div class="logo">

                <i class="fa-solid fa-brain"></i>

                <span>AI Career</span>

            </div>

            <ul>

                <li onclick="location.href='admin.html'">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </li>

                <li onclick="location.href='students.html'">

                    <i class="fa-solid fa-user-graduate"></i>

                    Students

                </li>

                <li class="active">

                    <i class="fa-solid fa-file-circle-question"></i>

                    Questions

                </li>

                <li>

                    <i class="fa-solid fa-chart-column"></i>

                    Reports

                </li>

                <li>

                    <i class="fa-solid fa-robot"></i>

                    AI Analytics

                </li>

                <li>

                    <i class="fa-solid fa-gear"></i>

                    Settings

                </li>

            </ul>

        </aside>

        <!---------------- MAIN ---------------->

        <div class="main">

            <div class="topbar">

                <div>

                    <h2>

                        Question Management

                    </h2>

                    <p>

                        Manage aptitude & career questions

                    </p>

                </div>

                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#questionModal">

                    <i class="fa fa-plus"></i>

                    Add Question

                </button>

            </div>

            <!---------------- SEARCH ---------------->

            <div class="toolbar">

                <input id="searchQuestion" class="form-control" placeholder="Search question...">

                <select id="categoryFilter" class="form-select">

                    <option value="">All Categories</option>

                    <option>Software</option>

                    <option>AI</option>

                    <option>Database</option>

                    <option>Networking</option>

                    <option>Cyber Security</option>

                </select>

                <select id="difficultyFilter" class="form-select">

                    <option value="">All Difficulty</option>

                    <option>Easy</option>

                    <option>Medium</option>

                    <option>Hard</option>

                </select>

            </div>

            <!---------------- TABLE ---------------->

            <div class="table-card">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Question</th>
                            <th>Category</th>
                            <th>Difficulty</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="questionTable">

                    </tbody>

                </table>

            </div>

            <!-- Pagination -->

            <div class="pagination-box">

                <button class="btn btn-primary" onclick="previousPage()">

                    Previous

                </button>

                <span id="pageInfo">

                    Page 1

                </span>

                <button class="btn btn-primary" onclick="nextPage()">

                    Next

                </button>

            </div>

            <!---------------- MODAL ---------------->

            <div class="modal fade" id="questionModal">

                <div class="modal-dialog modal-lg">

                    <div class="modal-content">

                        <div class="modal-header">

                            <h5>

                                Question

                            </h5>

                            <button class="btn-close" data-bs-dismiss="modal">

                            </button>

                        </div>

                        <div class="modal-body">

                            <form id="questionForm">

                                <input type="hidden" id="questionId">

                                <label>

                                    Question

                                </label>

                                <textarea id="question" class="form-control mb-3" required>

</textarea>

                                <div class="row">

                                    <div class="col-md-6">

                                        <input id="optionA" class="form-control mb-3" placeholder="Option A" required>

                                    </div>

                                    <div class="col-md-6">

                                        <input id="optionB" class="form-control mb-3" placeholder="Option B" required>

                                    </div>

                                    <div class="col-md-6">

                                        <input id="optionC" class="form-control mb-3" placeholder="Option C" required>

                                    </div>

                                    <div class="col-md-6">

                                        <input id="optionD" class="form-control mb-3" placeholder="Option D" required>

                                    </div>

                                </div>

                                <select id="correctAnswer" class="form-select mb-3">

                                    <option>A</option>

                                    <option>B</option>

                                    <option>C</option>

                                    <option>D</option>

                                </select>

                                <select id="category" class="form-select mb-3">

                                    <option>Software</option>

                                    <option>AI</option>

                                    <option>Database</option>

                                    <option>Networking</option>

                                    <option>Cyber Security</option>

                                </select>

                                <select id="difficulty" class="form-select mb-3">

                                    <option>Easy</option>

                                    <option>Medium</option>

                                    <option>Hard</option>

                                </select>

                                <button class="btn btn-primary w-100" type="submit">

                                    Save Question

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

            <script src="js/questions.js"></script>
            <script src="js/logout.js"></script>

</body>

</html>
