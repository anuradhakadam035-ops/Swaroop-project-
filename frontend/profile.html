<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

    <div class="container py-5">

        <div class="card p-4 shadow-lg">

            <div class="text-center mb-4">

                <img id="profilePhoto" src="images/user.png" class="rounded-circle">

                <br><br>

                <input type="file" id="photoInput" hidden>

                <button class="upload-btn" onclick="document.getElementById('photoInput').click()">

                    <i class="fa-solid fa-camera"></i>

                    Change Photo

                </button>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Full Name</label>

                    <input id="fullName" class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Email</label>

                    <input id="email" class="form-control" readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Mobile</label>

                    <input id="mobile" class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>College</label>

                    <input id="college" class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Branch</label>

                    <input id="branch" class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Year</label>

                    <input id="year" class="form-control">

                </div>

                <div class="col-12 mb-3">

                    <label>Skills</label>

                    <textarea id="skills" class="form-control"></textarea>

                </div>

                <div class="col-12 mb-4">

                    <label>Interests</label>

                    <textarea id="interests" class="form-control"></textarea>

                </div>

            </div>

            <button id="saveBtn" class="btn btn-primary">

                Save Changes

            </button>

        </div>

    </div>

    <script src="js/profile.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/logout.js"></script>

</body>

</html>
