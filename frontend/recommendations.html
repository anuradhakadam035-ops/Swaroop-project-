<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Recommendation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/recommendation.css">

</head>

<body>

    <div class="container py-5">

        <h1 class="title">

            <i class="fa-solid fa-robot"></i>

            AI Career Recommendation

        </h1>

        <!-- Top Cards -->

        <div class="row mt-4">

            <div class="col-md-3">

                <div class="info-card">

                    <h6>Career</h6>

                    <h3 id="career">-</h3>

                </div>

            </div>

            <div class="col-md-3">

                <div class="info-card">

                    <h6>Match</h6>

                    <h3 id="match">0%</h3>

                </div>

            </div>

            <div class="col-md-3">

                <div class="info-card">

                    <h6>Salary</h6>

                    <h3 id="salary">-</h3>

                </div>

            </div>

            <div class="col-md-3">

                <div class="info-card">

                    <h6>Growth</h6>

                    <h3 id="growth">-</h3>

                </div>

            </div>

        </div>

        <!-- Strengths -->

        <div class="section">

            <h4>

                <i class="fa-solid fa-star"></i>

                Strengths

            </h4>

            <div id="strengths"></div>

        </div>

        <!-- Skill Gap -->

        <div class="section">

            <h4>

                <i class="fa-solid fa-triangle-exclamation"></i>

                Skill Gap

            </h4>

            <div id="skillGap"></div>

        </div>

        <!-- Courses -->

        <div class="section">

            <h4>

                <i class="fa-solid fa-book"></i>

                Recommended Courses

            </h4>

            <div id="courses"></div>

        </div>

        <!-- Roadmap -->

        <div class="section">

            <h4>

                <i class="fa-solid fa-road"></i>

                Career Roadmap

            </h4>

            <ul id="roadmap" class="roadmap"></ul>

        </div>

    </div>

    <script src="js/recommendation.js"></script>

</body>

</html>
