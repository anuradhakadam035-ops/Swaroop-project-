<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Career Guidance</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>



<body>

    <div class="login-page">

        <div class="login-card">

            <div class="text-center mb-4">

                <i class="fa-solid fa-brain login-logo"></i>

                <h2>Welcome Back</h2>

                <p>Login to continue your AI Career Journey</p>

            </div>

            <form id="loginForm">

                <div class="mb-3">

                    <label>Email Address</label>

                    <input type="email" id="email" class="form-control custom-input" placeholder="Enter your email"
                        required>
                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input type="password" id="loginPassword" class="form-control custom-input" placeholder="Password"
                        required>
                </div>

                <div class="d-flex justify-content-between mb-4">

                    <div>

                        <input type="checkbox">

                        Remember Me

                    </div>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit" class="login-submit" id="loginBtn">

                    Login

                </button>
            </form>

            <hr>

            <button class="google-btn">

                <i class="fab fa-google"></i>

                Continue with Google

            </button>

            <div class="text-center mt-4">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </div>

        </div>


    </div>

    <script src="js/auth.js"></script>

</body>

</html>
