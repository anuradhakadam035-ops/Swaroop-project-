<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Career Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/chat.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <div class="sidebar">

            <h2>

                <i class="fa-solid fa-robot"></i>

                AI Career

            </h2>

            <ul>

                <li onclick="location.href='dashboard.html'">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </li>

                <li onclick="location.href='assessment.html'">

                    <i class="fa-solid fa-book"></i>

                    Assessment

                </li>

                <li onclick="location.href='career.html'">

                    <i class="fa-solid fa-bullseye"></i>

                    Career

                </li>

                <li class="active">

                    <i class="fa-solid fa-comments"></i>

                    AI Chat

                </li>

            </ul>

        </div>

        <!-- Main -->

        <div class="main">

            <div class="topbar">

                <h2>

                    AI Career Assistant

                </h2>

            </div>

            <div id="chatBox" class="chat-box">

            </div>

            <div class="chat-input">

                <input id="message" type="text" placeholder="Ask your career question...">

                <button id="sendBtn">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </div>

        </div>

    </div>

    <script src="js/chat.js"></script>
    <script src="js/logout.js"></script>




</body>

</html>
